# Skills / tools / certs to look for in job adverts.
# Format:   "Display name" = ["alias", "another alias"]
# Whole-word matching. Lower-case aliases ignore case; an alias with capitals must match
# exactly (so "React" the framework, not "react quickly"). Add anything you want tracked.
# After editing, re-count everything with:  uv run ghostjobs score

