[project]
name = "ghostjobs"
version = "0.1.0"
description = "Score job postings on how likely they are to be ghost jobs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "rapidfuzz>=3.9",
]

[project.scripts]
ghostjobs = "ghostjobs.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostjobs"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
